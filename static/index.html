<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ITCS Support Chat</title>
<link rel="stylesheet" href="/static/styles.css?v=2" />
</head>
<body>

<div class="chat-wrapper">
  <div class="chat-header">
    <h1>ITCS Support</h1>
    <div class="mode-toggle">
      <span class="active" id="lbl-text">Text</span>
      <div class="switch" id="mode-switch" role="switch" tabindex="0" aria-checked="false"></div>
      <span id="lbl-voice">Voice</span>
    </div>
  </div>

  <div class="chat-messages" id="messages">
    <div class="welcome" id="welcome">
      <div>
        <h2>Welcome</h2>
        <p>Ask a question and I'll find the answer from our knowledge base.</p>
      </div>
    </div>
  </div>

  <!-- text mode -->
  <div class="chat-input" id="text-input-bar">
    <textarea id="user-input" rows="1" placeholder="Type your question..." autocomplete="off"></textarea>
    <button class="send-btn" id="send-btn" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

  <!-- voice mode -->
  <div class="voice-bar" id="voice-bar">
    <div class="state-dot" id="state-dot"></div>
    <span class="voice-bar-text" id="voice-bar-text">Starting...</span>
    <div class="waveform" id="waveform"></div>
  </div>
</div>

<script src="/static/app.js?v=2"></script>
</body>
</html>
