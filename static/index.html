<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ITCS Support Chat</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root{
    --primary:#0f62fe;
    --primary-hover:#0353e9;
    --bg:#f4f4f4;
    --surface:#ffffff;
    --text:#161616;
    --text-secondary:#525252;
    --border:#e0e0e0;
    --user-bg:#0f62fe;
    --user-text:#ffffff;
    --bot-bg:#e8e8e8;
    --bot-text:#161616;
    --danger:#da1e28;
    --green:#24a148;
    --purple:#8a3ffc;
    --radius:12px;
    --shadow:0 2px 8px rgba(0,0,0,.08);
  }

  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text)}

  .chat-wrapper{
    display:flex;flex-direction:column;
    max-width:720px;height:100vh;
    margin:0 auto;background:var(--surface);
    box-shadow:var(--shadow);
  }

  /* ── header ────────────────────────────────── */
  .chat-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;border-bottom:1px solid var(--border);
    background:var(--surface);flex-shrink:0;
  }
  .chat-header h1{font-size:16px;font-weight:600;letter-spacing:-.2px}

  .mode-toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary)}
  .mode-toggle span{user-select:none;cursor:pointer}
  .mode-toggle span.active{color:var(--primary);font-weight:600}

  .switch{
    position:relative;width:40px;height:22px;
    background:var(--border);border-radius:11px;
    cursor:pointer;transition:background .2s;
  }
  .switch::after{
    content:"";position:absolute;top:3px;left:3px;
    width:16px;height:16px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);
    transition:transform .2s;
  }
  .switch.on{background:var(--primary)}
  .switch.on::after{transform:translateX(18px)}

  /* ── messages ──────────────────────────────── */
  .chat-messages{
    flex:1;overflow-y:auto;padding:20px;
    display:flex;flex-direction:column;gap:12px;
  }
  .chat-messages::-webkit-scrollbar{width:5px}
  .chat-messages::-webkit-scrollbar-thumb{background:#c6c6c6;border-radius:3px}

  .msg{
    max-width:80%;padding:10px 14px;line-height:1.5;
    font-size:14px;border-radius:var(--radius);
    white-space:pre-wrap;word-wrap:break-word;
    animation:fadeUp .25s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  .msg.user{align-self:flex-end;background:var(--user-bg);color:var(--user-text);border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--bot-bg);color:var(--bot-text);border-bottom-left-radius:4px}

  .typing{display:flex;gap:4px;padding:10px 14px;align-self:flex-start}
  .typing span{width:7px;height:7px;border-radius:50%;background:#a8a8a8;animation:blink 1.4s infinite both}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

  .welcome{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--text-secondary);padding:40px}
  .welcome h2{font-size:18px;font-weight:600;color:var(--text);margin-bottom:6px}
  .welcome p{font-size:14px;line-height:1.5}

  /* ── text input bar ────────────────────────── */
  .chat-input{
    display:flex;align-items:center;gap:10px;
    padding:14px 20px;border-top:1px solid var(--border);
    background:var(--surface);flex-shrink:0;
  }
  .chat-input textarea{
    flex:1;resize:none;border:1px solid var(--border);
    border-radius:10px;padding:10px 14px;font-size:14px;
    font-family:inherit;line-height:1.4;
    outline:none;transition:border-color .15s;
    max-height:120px;overflow-y:auto;
  }
  .chat-input textarea:focus{border-color:var(--primary)}
  .chat-input textarea::placeholder{color:#a8a8a8}

  .send-btn{
    width:40px;height:40px;border:none;border-radius:50%;
    background:var(--primary);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,opacity .15s;flex-shrink:0;
  }
  .send-btn:hover{background:var(--primary-hover)}
  .send-btn:disabled{opacity:.4;cursor:not-allowed}
  .send-btn svg{width:18px;height:18px}

  /* ── voice status bar ──────────────────────── */
  .voice-bar{
    display:none;align-items:center;justify-content:center;gap:12px;
    padding:16px 20px;border-top:1px solid var(--border);
    background:var(--surface);flex-shrink:0;
  }
  .voice-bar.visible{display:flex}

  .state-dot{
    width:10px;height:10px;border-radius:50%;
    flex-shrink:0;transition:background .3s;
  }
  .state-dot.listening{background:var(--green);animation:glow-green 2s ease-in-out infinite}
  .state-dot.recording{background:var(--danger);animation:glow-red 1s ease-in-out infinite}
  .state-dot.processing{background:var(--primary);animation:none}
  .state-dot.speaking{background:var(--purple);animation:glow-purple 1.5s ease-in-out infinite}

  @keyframes glow-green{0%,100%{box-shadow:0 0 0 0 rgba(36,161,72,.5)}50%{box-shadow:0 0 0 6px rgba(36,161,72,0)}}
  @keyframes glow-red{0%,100%{box-shadow:0 0 0 0 rgba(218,30,40,.5)}50%{box-shadow:0 0 0 8px rgba(218,30,40,0)}}
  @keyframes glow-purple{0%,100%{box-shadow:0 0 0 0 rgba(138,63,252,.4)}50%{box-shadow:0 0 0 6px rgba(138,63,252,0)}}

  .voice-bar-text{font-size:13px;color:var(--text-secondary)}

  /* ── waveform visualiser ───────────────────── */
  .waveform{display:flex;align-items:center;gap:2px;height:20px}
  .waveform .bar{
    width:3px;border-radius:2px;
    background:var(--border);
    transition:height .1s ease,background .3s;
  }
  .waveform.active .bar{background:var(--green)}
  .waveform.recording .bar{background:var(--danger)}
  .waveform.speaking .bar{background:var(--purple)}
</style>
</head>
<body>

<div class="chat-wrapper">
  <div class="chat-header">
    <h1>ITCS Support</h1>
    <div class="mode-toggle">
      <span class="active" id="lbl-text">Text</span>
      <div class="switch" id="mode-switch" role="switch" tabindex="0" aria-checked="false"></div>
      <span id="lbl-voice">Voice</span>
    </div>
  </div>

  <div class="chat-messages" id="messages">
    <div class="welcome" id="welcome">
      <div>
        <h2>Welcome</h2>
        <p>Ask a question and I'll find the answer from our knowledge base.</p>
      </div>
    </div>
  </div>

  <!-- text mode -->
  <div class="chat-input" id="text-input-bar">
    <textarea id="user-input" rows="1" placeholder="Type your question..." autocomplete="off"></textarea>
    <button class="send-btn" id="send-btn" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

  <!-- voice mode -->
  <div class="voice-bar" id="voice-bar">
    <div class="state-dot" id="state-dot"></div>
    <span class="voice-bar-text" id="voice-bar-text">Starting...</span>
    <div class="waveform" id="waveform"></div>
  </div>
</div>

<script>
(() => {
  /* ── DOM ──────────────────────────────────── */
  const messagesEl  = document.getElementById("messages");
  const welcomeEl   = document.getElementById("welcome");
  const inputEl     = document.getElementById("user-input");
  const sendBtn     = document.getElementById("send-btn");
  const modeSwitch  = document.getElementById("mode-switch");
  const lblText     = document.getElementById("lbl-text");
  const lblVoice    = document.getElementById("lbl-voice");
  const textBar     = document.getElementById("text-input-bar");
  const voiceBarEl  = document.getElementById("voice-bar");
  const stateDot    = document.getElementById("state-dot");
  const voiceText   = document.getElementById("voice-bar-text");
  const waveformEl  = document.getElementById("waveform");

  const NUM_BARS = 20;
  for (let i = 0; i < NUM_BARS; i++) {
    const b = document.createElement("div");
    b.className = "bar";
    b.style.height = "4px";
    waveformEl.appendChild(b);
  }
  const bars = waveformEl.querySelectorAll(".bar");

  let history = [];
  let busy    = false;

  /* ════════════════════════════════════════════
     SHARED HELPERS
     ════════════════════════════════════════════ */
  function addMessage(role, text) {
    if (welcomeEl && welcomeEl.parentNode) welcomeEl.remove();
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }
  function showTyping() {
    const div = document.createElement("div");
    div.className = "typing"; div.id = "typing-indicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function removeTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  async function chatRequest(msgs) {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: msgs }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "", botText = "", lang = "en";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n"); buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const payload = line.slice(6);
        if (payload === "[DONE]") break;
        try {
          const d = JSON.parse(payload);
          if (d.error) throw new Error(d.error);
          if (d.content) botText = d.content;
          if (d.lang) lang = d.lang;
        } catch (e) { if (e.message && !e.message.startsWith("Unexpected")) throw e; }
      }
    }
    return { text: botText, lang };
  }

  /* ════════════════════════════════════════════
     TEXT CHAT (unchanged)
     ════════════════════════════════════════════ */
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendText(); }
  });
  sendBtn.addEventListener("click", sendText);

  async function sendText() {
    const text = inputEl.value.trim();
    if (!text || busy) return;
    addMessage("user", text);
    history.push({ role: "user", content: text });
    inputEl.value = ""; inputEl.style.height = "auto";
    busy = true; sendBtn.disabled = true; inputEl.disabled = true;
    showTyping();
    try {
      const { text: botText } = await chatRequest(history);
      removeTyping();
      addMessage("bot", botText || "No response received.");
      history.push({ role: "assistant", content: botText });
    } catch {
      removeTyping();
      addMessage("bot", "An error occurred. Please try again.");
    }
    busy = false; sendBtn.disabled = false; inputEl.disabled = false;
    inputEl.focus();
  }

  /* ════════════════════════════════════════════
     VOICE SESSION — continuous hands-free
     ════════════════════════════════════════════ */

  const VAD_INTERVAL_MS  = 80;
  const SPEECH_CONFIRM   = 3;     // consecutive active frames to start recording
  const SILENCE_END_MS   = 1200;  // silence duration to end recording
  const PRE_BUFFER_COUNT = 5;     // audio frames to keep before speech start
  const RMS_THRESHOLD    = 0.012;

  let voiceActive  = false;
  let voiceState   = "IDLE";
  let audioCtx     = null;
  let micStream    = null;
  let analyser     = null;
  let processor    = null;
  let vadTimer     = null;
  let chunks       = [];
  let preBuffer    = [];
  let speechFrames = 0;
  let silenceStart = null;
  let currentAudio = null;

  /* ── state management ─────────────────────── */
  function setVoiceState(state) {
    voiceState = state;
    stateDot.className = "state-dot " + state.toLowerCase();
    waveformEl.className = "waveform" + (
      state === "RECORDING" ? " recording" :
      state === "SPEAKING"  ? " speaking" :
      state === "LISTENING" ? " active" : ""
    );
    const labels = { LISTENING: "Listening...", RECORDING: "Recording...", PROCESSING: "Processing...", SPEAKING: "Speaking..." };
    voiceText.textContent = labels[state] || "";
  }

  /* ── waveform visualisation ───────────────── */
  function updateWaveform() {
    if (!analyser) return;
    const data = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(data);
    const step = Math.floor(data.length / NUM_BARS);
    for (let i = 0; i < NUM_BARS; i++) {
      let sum = 0;
      for (let j = 0; j < step; j++) sum += Math.abs(data[i * step + j]);
      const avg = sum / step;
      const h = Math.max(4, Math.min(20, avg * 500));
      bars[i].style.height = h + "px";
    }
  }

  /* ── WAV encoding ─────────────────────────── */
  function mergeChunks(arr) {
    const len = arr.reduce((s, c) => s + c.length, 0);
    const out = new Float32Array(len);
    let off = 0;
    for (const c of arr) { out.set(c, off); off += c.length; }
    return out;
  }
  function downsample(samples, from, to) {
    if (from === to) return samples;
    const ratio = from / to;
    const n = Math.round(samples.length / ratio);
    const out = new Float32Array(n);
    for (let i = 0; i < n; i++) out[i] = samples[Math.round(i * ratio)];
    return out;
  }
  function encodeWav(samples, sr) {
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0,"RIFF"); v.setUint32(4,36+samples.length*2,true);
    w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true);
    v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true);
    v.setUint16(32,2,true); v.setUint16(34,16,true);
    w(36,"data"); v.setUint32(40,samples.length*2,true);
    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(44+i*2, s < 0 ? s*0x8000 : s*0x7FFF, true);
    }
    return new Blob([buf], { type: "audio/wav" });
  }

  /* ── start / stop session ─────────────────── */
  async function startVoice() {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
    } catch {
      voiceText.textContent = "Microphone access denied";
      return false;
    }
    audioCtx = new AudioContext({ sampleRate: 16000 });
    const source = audioCtx.createMediaStreamSource(micStream);

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    source.connect(analyser);

    processor = audioCtx.createScriptProcessor(4096, 1, 1);
    processor.onaudioprocess = (e) => {
      const data = new Float32Array(e.inputBuffer.getChannelData(0));
      if (voiceState === "RECORDING") {
        chunks.push(data);
      } else {
        preBuffer.push(data);
        if (preBuffer.length > PRE_BUFFER_COUNT) preBuffer.shift();
      }
    };
    source.connect(processor);
    processor.connect(audioCtx.destination);

    voiceActive = true;
    speechFrames = 0;
    silenceStart = null;
    setVoiceState("LISTENING");
    startVAD();
    return true;
  }

  function stopVoice() {
    voiceActive = false;
    stopVAD();
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    if (processor) { processor.disconnect(); processor = null; }
    if (analyser) { analyser.disconnect(); analyser = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    chunks = []; preBuffer = [];
    setVoiceState("IDLE");
    bars.forEach(b => b.style.height = "4px");
  }

  /* ── VAD loop ─────────────────────────────── */
  function startVAD() {
    const buf = new Float32Array(analyser.fftSize);
    vadTimer = setInterval(() => {
      if (!voiceActive) return;
      analyser.getFloatTimeDomainData(buf);
      const rms = Math.sqrt(buf.reduce((s, v) => s + v * v, 0) / buf.length);
      const isSpeech = rms > RMS_THRESHOLD;
      updateWaveform();

      if (voiceState === "LISTENING") {
        if (isSpeech) {
          speechFrames++;
          if (speechFrames >= SPEECH_CONFIRM) {
            chunks = [...preBuffer];
            preBuffer = [];
            speechFrames = 0;
            silenceStart = null;
            setVoiceState("RECORDING");
          }
        } else {
          speechFrames = 0;
        }
      } else if (voiceState === "RECORDING") {
        if (!isSpeech) {
          if (!silenceStart) silenceStart = Date.now();
          if (Date.now() - silenceStart >= SILENCE_END_MS) {
            finishRecording();
          }
        } else {
          silenceStart = null;
        }
      } else if (voiceState === "SPEAKING") {
        if (isSpeech) {
          speechFrames++;
          if (speechFrames >= SPEECH_CONFIRM + 2) {
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            chunks = [...preBuffer];
            preBuffer = [];
            speechFrames = 0;
            silenceStart = null;
            setVoiceState("RECORDING");
          }
        } else {
          speechFrames = 0;
        }
      }
    }, VAD_INTERVAL_MS);
  }

  function stopVAD() {
    if (vadTimer) { clearInterval(vadTimer); vadTimer = null; }
  }

  /* ── process a finished recording ─────────── */
  async function finishRecording() {
    if (!voiceActive) return;
    setVoiceState("PROCESSING");
    const rate = audioCtx ? audioCtx.sampleRate : 16000;
    const pcm = mergeChunks(chunks);
    chunks = []; silenceStart = null;
    const final = rate !== 16000 ? downsample(pcm, rate, 16000) : pcm;
    const wav = encodeWav(final, 16000);

    try {
      /* STT */
      const fd = new FormData();
      fd.append("audio", wav, "r.wav");
      const sttRes = await fetch("/api/stt", { method: "POST", body: fd });
      const sttData = await sttRes.json();

      if (!sttData.text) {
        if (voiceActive) setVoiceState("LISTENING");
        return;
      }

      addMessage("user", sttData.text);
      history.push({ role: "user", content: sttData.text });
      showTyping();

      /* Chat */
      const { text: botText, lang } = await chatRequest(history);
      removeTyping();
      addMessage("bot", botText || "No response received.");
      history.push({ role: "assistant", content: botText });

      /* TTS */
      if (botText && voiceActive) {
        const ttsRes = await fetch("/api/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: botText, lang }),
        });
        if (ttsRes.ok && voiceActive) {
          const ab = await ttsRes.arrayBuffer();
          await playTTS(ab);
        }
      }
    } catch {
      removeTyping();
      addMessage("bot", "An error occurred during voice processing.");
    }

    if (voiceActive && voiceState !== "RECORDING") {
      setVoiceState("LISTENING");
    }
  }

  function playTTS(audioBuffer) {
    return new Promise((resolve) => {
      if (!voiceActive) { resolve(); return; }
      setVoiceState("SPEAKING");
      const blob = new Blob([audioBuffer], { type: "audio/mpeg" });
      const url = URL.createObjectURL(blob);
      currentAudio = new Audio(url);
      currentAudio.onended = () => {
        URL.revokeObjectURL(url);
        currentAudio = null;
        resolve();
      };
      currentAudio.onerror = () => { currentAudio = null; resolve(); };
      currentAudio.play().catch(() => { currentAudio = null; resolve(); });
    });
  }

  /* ════════════════════════════════════════════
     MODE TOGGLE
     ════════════════════════════════════════════ */
  modeSwitch.addEventListener("click", async () => {
    if (busy) return;
    const goingVoice = !voiceActive && !modeSwitch.classList.contains("on");

    if (goingVoice) {
      modeSwitch.classList.add("on");
      modeSwitch.setAttribute("aria-checked", "true");
      lblText.classList.remove("active");
      lblVoice.classList.add("active");
      textBar.style.display = "none";
      voiceBarEl.classList.add("visible");
      await startVoice();
    } else {
      stopVoice();
      modeSwitch.classList.remove("on");
      modeSwitch.setAttribute("aria-checked", "false");
      lblText.classList.add("active");
      lblVoice.classList.remove("active");
      textBar.style.display = "flex";
      voiceBarEl.classList.remove("visible");
    }
  });
})();
</script>
</body>
</html>
